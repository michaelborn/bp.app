name: Release (reusable)

# Conventional commits decide the bump:
#   BREAKING CHANGE footer or `!:` subject -> M+1.0.0
#   feat subjects -> M.+1.0
#   everything else -> patch
#
# release-please opens a "chore(main): release X.Y.Z" PR that bumps
# package.json, prepends a version section to changelog.md, and tags +
# creates the GitHub release once the PR merges. Re-runs on non-release
# pushes are no-ops.

on:
  workflow_call:
    permissions:
      contents: write
      pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          changelog-path: changelog.md
