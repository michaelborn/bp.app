name: CI

on:
  push:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
