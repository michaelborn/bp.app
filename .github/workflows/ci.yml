name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npx nuxt prepare && npx nuxt typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

  release:
    # Every push to main ships a release with a changelog built from the
    # commit messages since the previous tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag and changelog
        id: release
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "latest tag: ${latest:-none}"

          if [ -n "$latest" ]; then
            range="$latest..HEAD"
          else
            range="HEAD"
          fi
          commits=$(git log --no-merges --format='- %s (%h)' "$range")
          count=$(git rev-list --count "$range")
          echo "commits since ${latest:-origin}: $count"
          printf '%s\n' "$commits"

          if [ -z "$commits" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$latest" ]; then
            next=$(node -e "
              const tag = process.argv[1].slice(1).split('.').map(Number);
              tag[2] += $count;
              console.log('v' + tag.join('.'));
            " "$latest")
          else
            next=$(node -e "console.log('v0.1.' + ($count - 1))")
          fi

          {
            echo "## Changes"
            echo
            echo "$commits"
          } > RELEASE_NOTES.md

          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          gh release create "$tag" \
            --title "bp.app $tag" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
